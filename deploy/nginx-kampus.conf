# Konfigurasi Nginx untuk Dashboard SNBP & SNBT Indonesia
# Lokasi: /etc/nginx/sites-available/kampus-dashboard

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/kampus-dashboard;
    index index.html;

    # Kompresi aset
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # SPA fallback: semua rute React diteruskan ke index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Aset statis di-cache lama
    location ~* \.(js|css|woff2|woff|png|jpg|jpeg|gif|svg|ico|json)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
