name: Deploy Dashboard ke Ubuntu

on:
  push:
    branches: [main]
    paths:
      - 'dashboard/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependensi
        run: npm ci
        working-directory: dashboard

      - name: Build produksi
        run: npm run build
        working-directory: dashboard

      - name: Kirim hasil build ke server (rsync over SSH)
        uses: easingthemes/ssh-deploy@v5
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          remote-user: ${{ secrets.SSH_USER }}
          remote-host: ${{ secrets.SSH_HOST }}
          remote-port: ${{ secrets.SSH_PORT }}
          source: dashboard/dist/
          target: ${{ secrets.SERVER_PATH }}
          args: -rltgoDzvO --delete-after
